services:
  - type: web
    name: ai-calling-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ACCOUNT_SID
        sync: false
      - key: API_KEY_SID
        sync: false
      - key: API_KEY_SECRET
        sync: false
      - key: APP_SID
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: CALLER_ID
        sync: false
      - key: CALLBACK_BASE_URL
        sync: false
      - key: DEFAULT_IDENTITY
        value: alice
      - key: OPENAI_API_KEY
        sync: false
